[package]
name = "thermo-esp32-s3"
version = "0.1.0"
edition = "2024"

[dependencies]
esp-hal = { version = "1.2.2", features = ["esp32s3", "unstable"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "jtag-serial"] }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
critical-section = "1.2.0"

[build-dependencies]
slint-build = "=1.18.1"
